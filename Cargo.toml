[workspace]
members = [".", "proxy-rs-derive"]

[package]
name = "proxy-rs"
version = "0.1.3"
edition = "2024"

[dependencies]
proxy-rs-derive = { path = "proxy-rs-derive" }
iroh = "0.98"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
iroh-tickets = "0.5.0"
dialoguer = "0.11"
dirs = "7.0.0"
indicatif = "0.17"
